# Конфигурация финансового агента. Скопируйте в config.yaml и правьте под себя.

model: finance-agent
host: http://localhost:11434

# Каталог для артефактов. <TICKER>/<YYYY-MM-DD> подставляется автоматически.
research_dir: docs/research

# Путь к skills (по умолчанию — в репо).
skills_dir: .claude/skills/financial-analysis

# Таймаут одного запроса к Ollama.
request_timeout: 600

# Параметры генерации (переопределяют дефолты Modelfile, если нужно).
options:
  temperature: 0.2
  top_p: 0.85
  repeat_penalty: 1.05
  num_ctx: 24576
