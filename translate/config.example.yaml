# Пример конфигурации перевода. Можно не использовать — все параметры доступны и через CLI.
# Скопируйте в config.yaml и правьте под себя.

model: translator-qwen
host: http://localhost:11434

# Размер куска в символах. Чем больше — тем связнее перевод, но тем дороже по VRAM.
# 4000 символов ≈ 1000-1200 токенов, отлично ложится в num_ctx=8192.
chunk_chars: 4000

# Сколько символов соседних абзацев добавлять как «контекст» (только для понимания, не переводится повторно).
overlap_chars: 0

# Таймаут одного запроса в секундах.
request_timeout: 600
